spring.application.name=pruebaapi
# ==========================================
# CONFIGURACIÓN DE LA BASE DE DATOS
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/banco_santander
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ==========================================
# Estrategia para DDL (create, update, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (útil para desarrollo)
spring.jpa.show-sql=true

# Formatear el SQL para que sea más legible
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de PostgreSQL (Spring Boot suele detectarlo automáticamente, pero es bueno asegurarlo)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACIÓN DE POOL DE CONEXIONES (HikariCP)
# ==========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000